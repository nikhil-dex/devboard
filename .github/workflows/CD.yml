name: CD
#sudo apt-get update && sudo apt-get install docker.io docker-compose-v2 -y
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - 'master'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Copy example env to main env
        run: cp .env.example .env

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Deploy the container with docker compose
        run: |
          docker compose pull
          docker compose up -d

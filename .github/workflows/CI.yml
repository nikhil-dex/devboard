name: CI

on:
  push:
    branches: [advanced]

jobs:  
  frontend:
    # for frontend
    # step 1: checkout code
    # step 2; setup nodejs
    # step 3; install npm packages
    # step 4: run linter
    # step 5: run tests
    # step 6: docker login
    # step 7: docker build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
        

      - name: Install npm packages
        working-directory: ./frontend
        run: npm ci
        
        
      - name: Run linters
        working-directory: ./frontend
        run: npm run lint
          
      - name: Run tests
        working-directory: ./frontend
        run: npm run test

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-frontend:latest




  backend:
    # for backend
    # step 1: checkout code
    # step 2; setup go lang
    # step 3; install go packages
    # step 4: run linter
    # step 5: run tests
    # step 6: docker login
    # step 7: docker build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: ./backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
        
      - name: Run go formattor
        run: go fmt 
        working-directory: ./backend

      - name: Run go Vet
        run: go vet
        working-directory: ./backend
          
      - name: Run tests
        working-directory: ./backend
        run: go test

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-backend:latest

  deploy:
    needs: [frontend,backend]
    uses: ./.github/workflows/CD.yml
    secrets: inherit





  
#Goal: Build the image for Devboard Frontend and Push to Docker hub
name: CI

on:
 push:
  branches: [master]

jobs:
  code-lint:
   runs-on: ubuntu-latest
   steps:
   - name: Checkout code
     uses: actions/checkout@v7

   - name: Set up Node.js
     uses: actions/setup-node@v7
     with:
        node-version: 24
        cache: npm
        cache-dependency: frontend/package-lock.json

      # ESLint and Prettier must be in `package.json`
   - name: Install Node.js dependencies
     working-directory: ./frontend
     run: npm ci
      
   - name: Run linters
     uses: wearerequired/lint-action@v3
     with:
          eslint: true
          prettier: true

     
  build-and-push:
    needs: [code-lint]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Docker Setup [Login to Docker hub]
      uses: docker/login-action@v4
      with:
        username: ${{vars.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_TOKEN}}

    - name: Docker Build and Push
      uses: docker/build-push-action@v6
      with:
       context: ./frontend
       file: ./frontend/Dockerfile
       push: true
       tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-fe-master-second:latest

  

      
      
